name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Fail loudly instead of shipping placeholder canonical/OG/sitemap URLs.
      # Set it under Settings > Secrets and variables > Actions > Variables.
      # Note workers.dev is <worker>.<account>.workers.dev — the account
      # subdomain is easy to leave out, and the result still looks right.
      - name: Require SITE_URL
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::SITE_URL repo variable is not set. Canonical tags, Open Graph URLs, the sitemap and robots.txt would ship pointing at the placeholder domain."
            exit 1
          fi
          echo "Building for $SITE_URL"

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
